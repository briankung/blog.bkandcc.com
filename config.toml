base_url = "https://blog.bkandcc.com"
title = "bkandcc"
description = "Notes from Brian and Cici."
default_language = "en"
generate_feeds = true
feed_filenames = ["atom.xml"]
compile_sass = true
build_search_index = false

taxonomies = [
  { name = "categories", paginate_by = 10 },
  { name = "tags", paginate_by = 10 },
]

[markdown.highlighting]
theme = "catppuccin-latte"

[link_checker]
internal_level = "warn"
external_level = "warn"

[extra]
author = "Brian Kung"
