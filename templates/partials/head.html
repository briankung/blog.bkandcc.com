<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/main.css">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  {%- set page_title = page.title | default(value=section.title | default(value="")) -%}
  {%- set page_desc = page.description | default(value=section.description | default(value=config.description)) -%}
  <title>{% if page_title %}{{ page_title }} · {{ config.title }}{% else %}{{ config.title }}{% endif %}</title>
  <meta name="description" content="{{ page_desc }}">
  <link rel="canonical" href="{% if page.permalink %}{{ page.permalink | safe }}{% elif section.permalink %}{{ section.permalink | safe }}{% else %}{{ config.base_url | safe }}{% endif %}">
  <meta property="og:title" content="{% if page_title %}{{ page_title }}{% else %}{{ config.title }}{% endif %}">
  <meta property="og:description" content="{{ page_desc }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta name="twitter:card" content="summary">
</head>
