{% extends "base.html" %}
{% block content %}
{% if page.date %}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% set post = page %}{% include "partials/post-meta.html" %}
  </header>
  <div class="post-content">
    {{ page.content | safe }}
  </div>
</article>
{% else %}
<article class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  <div class="page-content">
    {{ page.content | safe }}
  </div>
</article>
{% endif %}
{% endblock %}
